<script>
const playlist = [
  { title: "CocaineWoman", src: "Cocaine Woman.mp3" },
  { title: "2 Phones", src: "2 Phones.mp3" },
  { title: "Space Cowboy", src: "SPACE COWBOY.mp3" },
  { title: "Siri?", src: "alli n word spam.mp3" },

];

let currentTrackIndex = 0;
let isPlaying = false;

function loadTrack(index) {
  const audio = document.getElementById('bg-music');
  const titleDisplay = document.getElementById('song-title');

  if (playlist.length > 0 && playlist[index]) {
    audio.src = playlist[index].src;
    
    // Updates the display text to the current track title
    if (titleDisplay) {
      titleDisplay.textContent = playlist[index].title;
    }
  }
}
function playTrack() {
  const audio = document.getElementById('bg-music');
  audio.play().then(() => {
    isPlaying = true;
    updatePlayBtn();
  }).catch(err => {
    console.log("Autoplay blocked or audio load error:", err);
  });
}

function pauseTrack() {
  const audio = document.getElementById('bg-music');
  audio.pause();
  isPlaying = false;
  updatePlayBtn();
}

function togglePlay() {
  if (isPlaying) {
    pauseTrack();
  } else {
    playTrack();
  }
}

function nextSong() {
  currentTrackIndex = (currentTrackIndex + 1) % playlist.length;
  loadTrack(currentTrackIndex);
  playTrack();
}

function prevSong() {
  currentTrackIndex = (currentTrackIndex - 1 + playlist.length) % playlist.length;
  loadTrack(currentTrackIndex);
  playTrack();
}

function updatePlayBtn() {
  const playBtn = document.getElementById('play-btn');
  if (playBtn) {
    playBtn.innerHTML = isPlaying 
      ? '<i class="fa-solid fa-pause"></i>' 
      : '<i class="fa-solid fa-play"></i>';
  }
}

window.addEventListener('DOMContentLoaded', () => {
  loadTrack(currentTrackIndex);

  const audio = document.getElementById('bg-music');
  if (audio) {
    audio.addEventListener('ended', nextSong);
  }
});

function openSite() {
  const entryScreen = document.getElementById('entry-screen');
  if (entryScreen) {
    entryScreen.classList.add('fade-out');
    sessionStorage.setItem('siteEntered', 'true');
  }

  playTrack();
}
</script>
